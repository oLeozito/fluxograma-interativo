<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mapa Curricular UEFS</title>
    <style>
        :root {
            --bg: #F5F4F0;
            --hd: #FFFFFF;
            --card: #FFFFFF;
            --ink: #23272F;
            --mut: #5D6572;
            --line: #9AA1AB;
            --bd: #DDD9D0;
            --band: #ECEAE4;
            --acc: #111827;
            --sel: #64748B;
            --rule: #F3E2DB;
            --rulet: #7A3B2E;
            --ok: #4E8070;
            --av: #059669;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #16181C;
                --hd: #1D2025;
                --card: #23272D;
                --ink: #E6E8EB;
                --mut: #A3AAB5;
                --line: #6B7482;
                --bd: #2F343C;
                --band: #1C1F24;
                --acc: #F3F4F6;
                --sel: #94A3B8;
                --rule: #3A2A27;
                --rulet: #EBB8A9;
                --ok: #78B5A0;
                --av: #34D399
            }
        }

        :root[data-theme="dark"] {
            --bg: #16181C;
            --hd: #1D2025;
            --card: #23272D;
            --ink: #E6E8EB;
            --mut: #A3AAB5;
            --line: #6B7482;
            --bd: #2F343C;
            --band: #1C1F24;
            --acc: #F3F4F6;
            --sel: #94A3B8;
            --rule: #3A2A27;
            --rulet: #EBB8A9;
            --ok: #78B5A0;
            --av: #34D399
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--ink);
            font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif
        }

        header {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            padding: 8px 16px;
            background: var(--hd);
            border-bottom: 1px solid var(--bd)
        }

        h1 {
            font-size: 19px;
            margin: 0;
            font-weight: 700
        }

        header p {
            margin: 2px 0 0;
            color: var(--mut);
            font-size: 12px;
            letter-spacing: .03em
        }

        .sems {
            display: flex;
            gap: 3px;
            align-items: center;
            margin: 0 auto
        }

        .sems .sd {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px 3px 5px;
            border-radius: 16px;
            border: 1px solid transparent;
            background: none;
            font-size: 12px;
            color: var(--mut)
        }

        .sd i {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: block
        }

        .sems .sd:hover {
            border-color: var(--line)
        }

        .sems .sd.on {
            border-color: var(--ink);
            color: var(--ink);
            background: var(--card)
        }

        .bar {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 12px;
            color: var(--mut)
        }

        .pb {
            width: 90px;
            height: 6px;
            border-radius: 3px;
            background: var(--bd);
            overflow: hidden
        }

        .pb i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--ok);
            transition: width .2s
        }

        button {
            font: inherit;
            font-weight: 600;
            font-size: 12px;
            color: var(--ink);
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 8px;
            padding: 6px 11px;
            cursor: pointer
        }

        button:hover {
            border-color: var(--line)
        }

        .sw {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px
        }

        #ic {
            display: flex
        }

        .tr {
            width: 28px;
            height: 15px;
            border-radius: 8px;
            background: var(--line);
            position: relative
        }

        .tr::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--card);
            transition: left .15s
        }

        [aria-checked="true"] .tr::after {
            left: 15px
        }

        main {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: auto
        }

        svg#map {
            display: block;
            width: 100%;
            height: 100%;
            min-width: 1100px
        }

        #lg {
            position: absolute;
            right: 14px;
            top: 10px;
            width: 400px;
            max-height: calc(100% - 20px);
            overflow: auto;
            background: var(--hd);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 14px 16px;
            box-shadow: 0 8px 30px #0003;
            font-size: 12px
        }

        #lg[hidden] {
            display: none
        }

        #lg h2 {
            font-size: 12px;
            margin: 0 0 8px;
            letter-spacing: .06em
        }

        #lg p {
            margin: 5px 0;
            color: var(--mut)
        }

        #lg b {
            color: var(--ink)
        }

        .hg {
            display: grid;
            grid-template-columns: 1fr;
            gap: 3px 16px;
            margin: 6px 0 10px
        }

        .hg div {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--bd);
            padding: 2px 0
        }

        .zt {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .07em;
            fill: var(--mut)
        }

        .sub {
            font-size: 9px;
            fill: var(--mut)
        }

        .bl {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .08em;
            fill: var(--mut);
            text-anchor: end
        }

        .band {
            fill: var(--band)
        }

        .cl {
            fill: none;
            stroke: var(--mut);
            stroke-width: 1.2;
            stroke-dasharray: 4 3
        }

        .clt {
            font-size: 7px;
            font-weight: 700;
            letter-spacing: .06em;
            fill: var(--mut)
        }

        .card,
        .slotg {
            cursor: pointer;
            transition: opacity .15s
        }

        .cr {
            fill: var(--card);
            stroke: var(--line);
            stroke-width: 1.2
        }

        .card:hover .cr,
        .card:focus .cr {
            stroke: var(--acc);
            stroke-width: 2
        }

        .card:focus {
            outline: none
        }

        .meta {
            font-size: 9.5px;
            fill: var(--mut);
            text-anchor: middle
        }

        .code {
            font-size: 14.5px;
            font-weight: 800;
            fill: var(--ink)
        }

        .nm {
            font-size: 8.5px;
            font-weight: 600;
            fill: var(--mut)
        }

        .bd {
            fill: var(--card);
            stroke: var(--line);
            stroke-width: 1.3
        }

        .ct {
            font-size: 10px;
            font-weight: 800;
            fill: var(--ink);
            text-anchor: middle
        }

        .card.zero .bd {
            stroke-dasharray: 2 2;
            stroke: var(--ok)
        }

        .card.zero .ct {
            fill: var(--ok)
        }

        .ck {
            font-size: 13px;
            font-weight: 800;
            fill: var(--ok);
            opacity: 0
        }

        .done .ck {
            opacity: 1
        }

        .done {
            opacity: .4
        }

        .done .code {
            text-decoration: line-through
        }

        .edge {
            fill: none;
            stroke: var(--line);
            stroke-width: 1.6;
            opacity: .85;
            marker-end: url(#ar)
        }

        .edge.hot {
            stroke: var(--acc);
            stroke-width: 2.6;
            opacity: 1
        }

        .edge.dim {
            opacity: .06
        }

        .card.dim {
            opacity: .16
        }

        .card.hot .cr {
            stroke: var(--acc);
            stroke-width: 2.6
        }

        .card.rel .cr {
            stroke: var(--sel);
            stroke-width: 1.8
        }

        .cl.dim,
        .clt.dim {
            opacity: .15
        }

        .card.hot.done,
        .card.rel.done {
            opacity: 1
        }

        .slotg .cr {
            stroke-dasharray: 4 3
        }

        .rn {
            fill: var(--rule)
        }

        .rt {
            font-size: 8.5px;
            font-weight: 600;
            fill: var(--rulet)
        }

        .sl {
            font-size: 10px;
            font-weight: 700;
            fill: var(--ink)
        }

        #pk {
            position: fixed;
            left: 50%;
            top: 84px;
            transform: translateX(-50%);
            width: 440px;
            max-width: calc(100vw - 24px);
            box-sizing: border-box;
            background: var(--hd);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 14px 16px;
            box-shadow: 0 12px 40px #0004;
            z-index: 5;
            font-size: 12px
        }

        #pk[hidden] {
            display: none
        }

        #pk h2 {
            font-size: 12px;
            margin: 0;
            letter-spacing: .05em
        }

        #pq,
        .pa input {
            width: 100%;
            box-sizing: border-box;
            font: inherit;
            padding: 7px 10px;
            border: 1px solid var(--bd);
            border-radius: 8px;
            background: var(--card);
            color: var(--ink)
        }

        #pq {
            margin-top: 10px
        }

        #pl {
            max-height: 260px;
            overflow: auto;
            margin: 8px 0;
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .pi {
            display: flex;
            gap: 10px;
            align-items: baseline;
            text-align: left;
            width: 100%;
            padding: 7px 10px;
            font-weight: 400
        }

        .pi b {
            min-width: 58px
        }

        .pi span {
            flex: 1;
            color: var(--mut)
        }

        .pi em {
            font-style: normal;
            color: var(--mut);
            font-size: 10px
        }

        .pi.sel {
            border-color: var(--acc)
        }

        .pi:disabled {
            opacity: .45;
            cursor: default
        }

        .pe,
        .pn {
            color: var(--mut);
            margin: 8px 0;
            font-size: 11px
        }

        .pa {
            display: grid;
            grid-template-columns: 90px 1fr auto;
            gap: 6px;
            margin-top: 8px
        }

        .slotg.done {
            opacity: .65
        }

        .avr {
            fill: none;
            stroke: var(--av);
            stroke-width: 2.6;
            opacity: 0;
            pointer-events: none
        }

        .av .avr {
            opacity: 1
        }

        #av[aria-pressed="true"] {
            border-color: var(--av);
            color: var(--av);
            box-shadow: inset 0 0 0 1px var(--av)
        }

        select {
            font: inherit;
            font-weight: 600;
            font-size: 12px;
            color: var(--ink);
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 8px;
            padding: 6px 11px;
            cursor: pointer;
            max-width: 220px
        }

        select:hover {
            border-color: var(--line)
        }

        .eb {
            fill: var(--band);
            stroke: var(--line);
            stroke-width: 1;
            stroke-dasharray: 3 3;
            opacity: .75
        }

        .ebt {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .06em;
            fill: var(--mut)
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1>Fluxograma Interativo</h1>
            <p id="sub"></p>

                role="switch" aria-checked="false" aria-label="Alternar modo claro e escuro"><span id="ic"></span><span

    <main>

            <defs>
                <marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">

            <g id="bg"></g>
            <g id="ed"></g>
            <g id="cl"></g>

        <div id="pk" hidden role="dialog" aria-label="Escolher disciplina optativa">
            <div style="display:flex;justify-content:space-between;align-items:center">
                <h2 id="pt"></h2><button id="px" aria-label="Fechar">×</button>
            </div><input id="pq" type="search" placeholder="Pesquisar por código ou nome" autocomplete="off">
            <div id="pl"></div>
            <p class="pn" id="pn"></p>
            <div class="pa"><input id="ac" placeholder="Código" autocomplete="off"><input id="an"

            <div style="margin-top:10px"><button id="pc">Limpar vaga</button></div>
        </div>
    </main>

        $('sems').innerHTML = C.map((c, i) => '<button class="sd" data-s="' + (i + 1) + '" aria-pressed="false" aria-label="Destacar o ' + (i + 1) + 'º semestre"><i style="background:' + c + (i == 9 ? ';box-shadow:0 0 0 1.5px #F5D77A' : '') + '"></i>' + (i + 1) + 'º</button>').join('');
        $('sems').onclick = e => { const b = e.target.closest('.sd'); if (!b) return; const n = +b.dataset.s; selSem = selSem === n ? 0 : n; document.querySelectorAll('.sd').forEach(x => { const on = +x.dataset.s === selSem; x.setAttribute('aria-pressed', on); x.classList.toggle('on', on) }); rh() };
        // legenda e tema
        function lgSet(o) { $('lg').hidden = !o; $('lb').setAttribute('aria-expanded', o) }
        $('lb').onclick = () => lgSet($('lg').hidden);
        document.addEventListener('click', e => { if ($('lg').hidden || $('lg').contains(e.target) || $('lb').contains(e.target)) return; lgSet(false); e.stopPropagation() }, true);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') { lgSet(false); closePk() } });
        const SUN = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>', MOON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'; function icon(t) { $('ic').innerHTML = t === 'dark' ? MOON : SUN }
        function theme(t) { document.documentElement.setAttribute('data-theme', t); icon(t); $('th').setAttribute('aria-checked', t === 'dark'); try { localStorage.setItem('uefs-theme', t) } catch (e) { } }
        let t0 = null; try { t0 = localStorage.getItem('uefs-theme') } catch (e) { }
        document.documentElement.setAttribute('data-theme', t0 || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light')); $('th').setAttribute('aria-checked', document.documentElement.dataset.theme === 'dark'); icon(document.documentElement.dataset.theme);
        $('th').onclick = () => theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
        // optativas
        function items() { const c = pk.slice(0, 2); return (CAT[c] || []).concat(custom[c] || []) }
        function slotTxt(k) { const s = sg[k], a = assign[k]; let t = a ? a.c + ' · ' + a.n : s.u; if (t.length > 24) t = t.slice(0, 23) + '…'; s.ue.textContent = t }
        function renderPk() { const q = $('pq').value.trim().toLowerCase(), cur2 = assign[pk], used = new Set(Object.keys(assign).filter(k => k !== pk).map(k => assign[k].c)); const l = items().filter(x => !q || (x.c + ' ' + x.n).toLowerCase().includes(q)); $('pl').innerHTML = l.length ? l.map(x => '<button class="pi' + (cur2 && cur2.c === x.c ? ' sel' : '') + '" data-c="' + esc(x.c) + '"' + (used.has(x.c) ? ' disabled' : '') + '><b>' + esc(x.c) + '</b><span>' + esc(x.n) + '</span>' + (used.has(x.c) ? '<em>já usada</em>' : '') + '</button>').join('') : '<p class="pe">Nenhuma disciplina encontrada.</p>' }
        function openPk(k) { pk = k; $('pt').textContent = CN[k.slice(0, 2)] + ' · ' + sg[k].t.split(' · ')[0]; $('pq').value = ''; renderPk(); $('pk').hidden = false; $('pq').focus() }
        function closePk() { $('pk').hidden = true; pk = null }
        $('pq').oninput = renderPk; $('px').onclick = closePk;
        $('pl').onclick = e => { const b = e.target.closest('.pi'); if (!b || b.disabled) return; const x = items().find(i => i.c === b.dataset.c); if (!x) return; assign[pk] = { c: x.c, n: x.n }; done.add(pk); saveX(); save(); slotTxt(pk); paint(); closePk() };
        $('pc').onclick = () => { if (!pk) return; delete assign[pk]; done.delete(pk); saveX(); save(); slotTxt(pk); paint(); closePk() };
        $('ad').onclick = () => { const c = $('ac').value.trim().toUpperCase(); if (!c || !pk) return; const k = pk.slice(0, 2); custom[k] = custom[k] || []; if (!items().some(x => x.c === c)) custom[k].push({ c, n: $('an').value.trim() || 'Sem nome' }); saveX(); $('ac').value = ''; $('an').value = ''; renderPk() };
        document.addEventListener('click', e => { if ($('pk').hidden || $('pk').contains(e.target) || e.target.closest('.slotg')) return; closePk(); e.stopPropagation() }, true);
        // disponíveis
        function avail() { const H = { t: 0, m: 0 }; done.forEach(k => { const d = P[k], h = d ? d.hr : (sg[k] ? sg[k].h : 0); H.t += h; if (d && /^(MI|MO|DO)$/.test(d.t)) H.m += h }); const ok = k => !done.has(k) && (pre[k] || []).every(p => done.has(p)) && (!RQ[k] || H[RQ[k][0]] >= RQ[k][1]); const S = new Set(); D.forEach(d => { let o = ok(d.k); if (o && grp[d.k]) o = grp[d.k].every(m => done.has(m) || ok(m)); if (o) S.add(d.k) }); return S }
        function paintAv() { const S = avOn ? avail() : new Set(); document.querySelectorAll('.card').forEach(c => c.classList.toggle('av', S.has(c.dataset.id))) }
        $('av').onclick = () => { avOn = !avOn; $('av').setAttribute('aria-pressed', avOn); try { localStorage.setItem('uefs-av2', avOn ? '1' : '0') } catch (e) { } paintAv() };
        setCourse('eng');
    </script>
